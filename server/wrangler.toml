name = "openrooms-ws"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# D1 Database for persistent message history
[[d1_databases]]
binding = "DB"
database_name = "openrooms-history"
database_id = ""

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
